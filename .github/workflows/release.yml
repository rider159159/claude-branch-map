name: Release

# 兩種觸發方式:
#  1. push 一個 v 開頭的 tag(例 v0.2.0)→ 自動 build 並建立同名 Release
#  2. 在 Actions 頁手動執行(workflow_dispatch),需填入要發佈的 tag
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要發佈的 tag(例 v0.2.0)。手動執行時必填,會在當前 commit 上建立此 tag。'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
          - os: macos-14          # arm64 runner,對應 electron-builder 的 dmg arm64 target
            script: package:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # electron-vite build + electron-builder(產出見 dist/)
      # Windows: NSIS 安裝版 + portable 免安裝版;mac: dmg
      # --publish never:這一步只 build,不讓 electron-builder 自己發佈。
      #   tag 觸發時 electron-builder 預設會嘗試 publish 並要求 GH_TOKEN;
      #   發佈統一由後面的 release job 用 action-gh-release 處理。
      - run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 預設建立「草稿(draft)」Release,確認檔案無誤後到 Releases 頁按 Publish 才會對外公開。
      # 若想 tag 一推就直接公開,把下面 draft 改成 false。
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/*
